name: benchenv
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - networkx
  - pandas
  - matplotlib
  - tqdm
  - pyyaml
  - pip
  # PyTorch with CUDA 11.8 (works well on GTX 1060). If you prefer CPU-only, replace the next two lines with 'cpuonly'.
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  # SDP solver (used by solvers/SDP). You can remove if not needed.
  - cvxpy
  # Optional extras can be installed later if you have licenses:
  # - gurobi
  # - cplex
